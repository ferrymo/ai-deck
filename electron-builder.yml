appId: com.ferrymo.aideck
productName: AI Deck
directories:
  output: release
files:
  - out/**/*
  - package.json
  - resources/icon.png
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
publish:
  provider: github
  owner: ferrymo
  repo: ai-deck
